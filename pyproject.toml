[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dwh-copilot"
dynamic = ["version"]
description = "Аналитика корпоративного хранилища по вопросам на русском языке"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Кругликовский Павел Александрович" }]
keywords = ["text-to-sql", "mssql", "llm", "analytics", "vllm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Front-Ends",
]

dependencies = [
    "sqlglot>=27.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pandas>=2.2",
    # Требуется методу DataFrame.to_markdown, которым результат запроса
    # переводится в текст перед передачей в языковую модель.
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Драйвер СУБД и веб-интерфейс. Вынесены отдельно, чтобы проверки
# в среде непрерывной интеграции не требовали установки драйвера ODBC.
server = [
    "pyodbc>=5.1",
    "streamlit>=1.37",
    "plotly>=5.22",
]
# Модель эмбеддингов для отбора витрин по смысловой близости.
# В среде непрерывной интеграции не устанавливается: там работает
# лексический отбор, встроенный в модуль catalog.
embeddings = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/devAsmodeus/dwh-copilot"
Repository = "https://github.com/devAsmodeus/dwh-copilot"
Issues = "https://github.com/devAsmodeus/dwh-copilot/issues"

[project.scripts]
dwh-copilot-eval = "dwh_copilot.eval_runner:main"

[tool.hatch.version]
path = "src/dwh_copilot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dwh_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["dwh_copilot"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
