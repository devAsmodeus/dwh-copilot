name: Release

# Выпуск версий выполняется автоматически на основе сообщений коммитов
# в формате Conventional Commits. Инструмент release-please накапливает
# изменения в черновике запроса на слияние, ведёт файл CHANGELOG.md
# и поднимает номер версии. После слияния этого запроса создаётся тег,
# публикуется выпуск на GitHub и собирается пакет.
#
# Правила определения номера версии:
#   fix:            повышается младший разряд, например 0.1.0 в 0.1.1
#   feat:           повышается средний разряд, например 0.1.1 в 0.2.0
#   BREAKING CHANGE повышается старший разряд, например 0.2.0 в 1.0.0

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Подготовка выпуска
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: python
          package-name: dwh-copilot

  publish:
    name: Публикация пакета
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сборка дистрибутива
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Прикрепление файлов к выпуску
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" dist/*

  docker:
    name: Сборка образа контейнера
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag }}
