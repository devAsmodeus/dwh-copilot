name: CI

# Проверки выполняются при каждом изменении. Отдельно проверяется набор
# бизнес-вопросов: правка текста подсказки для модели, манифеста витрин
# или правил проверки SQL не должна снижать долю верных ответов.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Стиль кода и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Проверка стиля
        run: ruff check .

      - name: Проверка форматирования
        run: ruff format --check .

      - name: Проверка типов
        run: mypy

  tests:
    name: Модульные проверки (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Запуск проверок
        run: pytest --cov=dwh_copilot --cov-report=term-missing

  eval:
    name: Набор бизнес-вопросов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Проверка целостности набора
        # Каждый эталонный запрос обязан проходить собственную проверку
        # безопасности. Расхождение означает, что либо эталон ошибочен,
        # либо правила проверки стали строже, чем требуется.
        run: python -m dwh_copilot.eval_runner --check-only

  build:
    name: Сборка пакета
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Сборка дистрибутива
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Сохранение артефактов
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
